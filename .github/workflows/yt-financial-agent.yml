name: YouTube Financial Agent

on:
  schedule:
    # 05:00 UTC = 08:00 Israel in summer, 07:00 in winter.
    # GitHub cron is UTC-only and can be delayed a few minutes under load.
    - cron: "0 5 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: yt-financial-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yt-financial-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # GitHub runners are datacenter IPs, so YouTube always refuses us here
          # and every transcript comes from Supadata.
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python run_daily.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: yt-financial-agent/run_daily.log
          if-no-files-found: ignore
          retention-days: 14

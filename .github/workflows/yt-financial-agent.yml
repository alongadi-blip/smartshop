name: YouTube Financial Agent

on:
  schedule:
    # 05:00 UTC = 08:00 Israel in summer, 07:00 in winter.
    # GitHub cron is UTC-only and can be delayed a few minutes under load.
    - cron: "0 5 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

# The job only reads the checkout; it never writes back to the repo.
permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: yt-financial-agent

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yt-financial-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # GitHub runners are datacenter IPs, so YouTube always refuses us here
          # and every transcript comes from Supadata.
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # YouTube RSS returns 404 for days at a time; this is the fallback.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python run_daily.py

      # No log artifact on purpose. The repo is public, and GitHub's secret
      # masking rewrites the console stream but not the contents of an uploaded
      # file - so an artifact can publish a secret that the visible log hides.
      # The console log carries the same content and is masked.

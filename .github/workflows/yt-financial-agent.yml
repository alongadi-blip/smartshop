name: YouTube Financial Agent

on:
  schedule:
    # 05:00 UTC = 08:00 Israel in summer, 07:00 in winter.
    # GitHub cron is best-effort: it runs late under load and some mornings does
    # not fire at all. Three attempts, and whichever runs first delivers - the
    # later ones find nothing new and exit quietly.
    # Odd minutes on purpose: the top of the hour is the most contended slot on
    # GitHub's scheduler, and runs queued there were arriving 4-5 hours late.
    - cron: "23 4 * * *"
    - cron: "37 6 * * *"
    - cron: "41 8 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

# The job only reads the checkout; it never writes back to the repo.
permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: yt-financial-agent

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yt-financial-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Carries the "already summarised" list between runs. The key is unique
      # per run so it never hits and always saves; restore-keys pulls forward
      # the most recent list. Saved only when the job succeeds, which is what
      # we want - a failed run delivered nothing to remember.
      - name: Restore the sent-video memory
        uses: actions/cache@v4
        with:
          path: yt-financial-agent/sent_videos.json
          key: sent-videos-${{ github.run_id }}
          restore-keys: sent-videos-

      - name: Run the daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # GitHub runners are datacenter IPs, so YouTube always refuses us here
          # and every transcript comes from Supadata.
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # YouTube RSS returns 404 for days at a time; this is the fallback.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python run_daily.py

      # No log artifact on purpose. The repo is public, and GitHub's secret
      # masking rewrites the console stream but not the contents of an uploaded
      # file - so an artifact can publish a secret that the visible log hides.
      # The console log carries the same content and is masked.

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק זיכרון ערים 🌍</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  background:linear-gradient(135deg,#0a0e27 0%,#1a1f4b 50%,#0a0e27 100%);
  min-height:100vh;
  font-family:'Segoe UI',Arial,sans-serif;
  color:#fff;
  direction:rtl;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(1px 1px at 5% 8%,rgba(255,255,255,.8),transparent),
    radial-gradient(1px 1px at 15% 45%,rgba(255,255,255,.6),transparent),
    radial-gradient(1px 1px at 25% 20%,rgba(255,255,255,.9),transparent),
    radial-gradient(1px 1px at 35% 72%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 48% 35%,rgba(255,255,255,.7),transparent),
    radial-gradient(1px 1px at 58% 88%,rgba(255,255,255,.6),transparent),
    radial-gradient(1px 1px at 68% 15%,rgba(255,255,255,.8),transparent),
    radial-gradient(1px 1px at 75% 55%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 85% 30%,rgba(255,255,255,.7),transparent),
    radial-gradient(1px 1px at 93% 75%,rgba(255,255,255,.6),transparent);
  pointer-events:none;z-index:0;
}

.game-wrap{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 8px 30px;
}

/* ── HEADER ── */
header{
  width:100%;max-width:700px;
  text-align:center;margin-bottom:10px;
}

h1{
  font-size:clamp(1.3em,4vw,2em);
  background:linear-gradient(135deg,#f7971e,#ffd200,#f7971e);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:12px;letter-spacing:1px;
}

.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;
}

.stat{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:6px 8px;text-align:center;
}
.stat-label{font-size:.65em;color:rgba(255,255,255,.55);margin-bottom:2px}
.stat-value{font-size:clamp(.9em,3vw,1.3em);font-weight:700;color:#ffd200;transition:color .3s}
.stat-value.urgent{color:#ff4757!important;animation:urg .6s ease infinite alternate}
@keyframes urg{from{opacity:1}to{opacity:.4}}

.prog-wrap{margin-bottom:5px}
.prog-label{display:flex;justify-content:space-between;font-size:.65em;color:rgba(255,255,255,.45);margin-bottom:3px}
.prog-bar{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width 1s linear,background .5s}
.total-fill{background:linear-gradient(90deg,#11998e,#38ef7d)}
.total-fill.warn{background:linear-gradient(90deg,#f7971e,#ffd200)}
.total-fill.danger{background:linear-gradient(90deg,#cb2d3e,#ef473a)}
.turn-fill{background:linear-gradient(90deg,#4facfe,#00f2fe);transition:width .25s linear}

/* ── GRID 6×6 ── */
.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:clamp(5px,1.2vw,9px);
  width:100%;max-width:690px;
}

/* ── CARDS ── */
.card{
  aspect-ratio:1;perspective:700px;cursor:pointer;user-select:none;
}
.card.disabled{cursor:default;pointer-events:none}

.card-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,0,.2,1);
  border-radius:12px;
}
.card.flipped .card-inner,
.card.matched .card-inner{transform:rotateY(180deg)}

.card-face{
  position:absolute;width:100%;height:100%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:12px;overflow:hidden;
}

/* Back (hidden side) */
.card-back-face{
  background:linear-gradient(135deg,#1e3a6e,#2a5298);
  border:2px solid rgba(100,160,255,.25);
  display:flex;align-items:center;justify-content:center;
}
.card-back-face::before{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(255,255,255,.03) 9px,rgba(255,255,255,.03) 10px);
  border-radius:10px;
}
.q-mark{font-size:clamp(1.2em,4vw,2.2em);color:rgba(255,255,255,.22);z-index:1;position:relative}

/* Front (city photo) */
.card-front-face{
  transform:rotateY(180deg);
  border:2px solid rgba(255,255,255,.2);
  background:#1a1a2e;
  position:relative;
}
.card-front-face img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.name-bar{
  position:absolute;bottom:0;left:0;right:0;z-index:2;
  background:linear-gradient(transparent,rgba(0,0,0,.85) 40%);
  padding:14px 4px 4px;
  text-align:center;
  font-size:clamp(.42em,1.3vw,.65em);
  font-weight:700;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  line-height:1.2;
}

/* Matched */
.card.matched .card-inner{box-shadow:0 0 18px rgba(255,215,0,.7),0 0 35px rgba(255,215,0,.2)}
.card.matched .card-front-face{border-color:gold!important}

/* Mismatch shake */
.card.mismatch{animation:shake .38s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

/* Selected (first flip) */
.card.selected .card-inner{box-shadow:0 0 0 3px rgba(79,195,247,.9)}

/* ── OVERLAYS ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(12px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;text-align:center;padding:20px;
}
.overlay.hidden{display:none}

.ov-title{
  font-size:clamp(2em,7vw,3.5em);margin-bottom:8px;
  background:linear-gradient(135deg,#f7971e,#ffd200);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.ov-sub{font-size:clamp(.9em,2.5vw,1.2em);color:rgba(255,255,255,.7);margin-bottom:22px;line-height:1.7}

.city-preview{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:500px;margin-bottom:22px;
}
.city-thumb{
  width:70px;height:70px;border-radius:10px;
  object-fit:cover;border:2px solid rgba(255,255,255,.3);
}

.btn{
  padding:12px 36px;font-size:clamp(1em,3vw,1.2em);
  border:none;border-radius:50px;cursor:pointer;font-weight:700;
  transition:transform .2s,box-shadow .2s;margin:6px;
}
.btn:hover{transform:scale(1.06);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.btn-primary{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e}

.score-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  width:min(380px,90vw);margin:16px 0;
}
.sc-item{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:14px 10px;
}
.sc-label{font-size:.75em;color:rgba(255,255,255,.55);margin-bottom:4px}
.sc-val{font-size:1.7em;font-weight:700;color:#ffd200}

/* Music btn */
#music-btn{
  position:fixed;bottom:20px;left:20px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;padding:8px 16px;border-radius:30px;cursor:pointer;font-size:.9em;
  backdrop-filter:blur(10px);transition:background .2s;z-index:50;
}
#music-btn:hover{background:rgba(255,255,255,.2)}
#music-btn.on{background:rgba(247,151,30,.25);border-color:#f7971e;color:#ffd200}

@media(max-width:500px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- Start overlay -->
<div class="overlay" id="ov-start">
  <div class="ov-title">🌍 משחק זיכרון ערים</div>
  <div class="ov-sub">
    מצא 18 זוגות של תמונות מערים אייקוניות ברחבי העולם!<br>
    לוח 6×6 | 5 דקות | 10 שניות לכל תור
  </div>
  <div class="city-preview" id="preview-imgs"></div>
  <button class="btn btn-primary" onclick="startGame()">התחל משחק! 🎮</button>
</div>

<!-- End overlay -->
<div class="overlay hidden" id="ov-end">
  <div class="ov-title" id="end-title"></div>
  <div class="ov-sub" id="end-sub"></div>
  <div class="score-grid" id="end-scores"></div>
  <button class="btn btn-primary" onclick="restartGame()">שחק שוב! 🔄</button>
</div>

<!-- Game -->
<div class="game-wrap">
  <header>
    <h1>🌍 משחק זיכרון ערים 🌍</h1>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">⏱️ זמן כולל</div>
        <div class="stat-value" id="st-time">05:00</div>
      </div>
      <div class="stat">
        <div class="stat-label">🎯 זוגות</div>
        <div class="stat-value" id="st-pairs">0 / 18</div>
      </div>
      <div class="stat">
        <div class="stat-label">🔄 ניסיונות</div>
        <div class="stat-value" id="st-attempts">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">⏰ תור</div>
        <div class="stat-value" id="st-turn">—</div>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>זמן שנותר</span><span id="lbl-time">5:00</span></div>
      <div class="prog-bar"><div class="prog-fill total-fill" id="fill-time" style="width:100%"></div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>זמן לתור</span><span id="lbl-turn">—</span></div>
      <div class="prog-bar"><div class="prog-fill turn-fill" id="fill-turn" style="width:0%"></div></div>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</div>

<button id="music-btn" onclick="toggleMusic()">🎵 מוסיקה: כבוי</button>

<script>
// ═══════════════════════════════════════════
// 18 CITIES  –  real Unsplash photos
// ═══════════════════════════════════════════
const CITIES = [

  },

    img:'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#232526,#e94560'

    fb:'#8e2de2,#4a00e0'
  },

    img:'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#cb2d3e,#ef473a'
  },

    img:'https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=260&h=260&fit=crop&auto=format&q=75',

    img:'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=260&h=260&fit=crop&auto=format&q=75',

    id:'barcelona', name:'ברצלונה',
    img:'https://images.unsplash.com/photo-1539037116277-4db20889f2d4?w=260&h=260&fit=crop&auto=format&q=75',

    id:'dubai', name:'דובאי',
    img:'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#0f0c29,#302b63'
  },
  {
    id:'rio', name:'ריו',
    img:'https://images.unsplash.com/photo-1483729558449-99ef09a8c325?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#11998e,#38ef7d'
  },
  {
    id:'cairo', name:'קהיר',
    img:'https://images.unsplash.com/photo-1553913861-c0fddf2619ee?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#c9a84c,#7B6535'
  },
  {
    id:'amsterdam', name:'אמסטרדם',
    img:'https://images.unsplash.com/photo-1534351590666-13e3e96b5017?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#ee9ca7,#9B5A67'
  },
  {
    id:'istanbul', name:'איסטנבול',
    img:'https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#4b6cb7,#182848'
  },
  {
    id:'athens', name:'אתונה',
    img:'https://images.unsplash.com/photo-1555993539-1732b0258235?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#3494e6,#1A5276'
  },
  {
    id:'venice', name:'ונציה',
    img:'https://images.unsplash.com/photo-1514890547357-a9ee288728e0?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#4facfe,#1A75BD'
  },
  {
    id:'singapore', name:'סינגפור',
    img:'https://images.unsplash.com/photo-1565967511849-76a60a516170?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#20bf55,#017e3b'
  },
  {
    id:'prague', name:'פראג',
    img:'https://images.unsplash.com/photo-1541849546-216549ae216d?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#8e0e00,#4A0000'
  },
  {
    id:'santorini', name:'סנטוריני',
    img:'https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#2980b9,#1A5276'
  },
  {
    id:'jerusalem', name:'ירושלים',
    img:'https://images.unsplash.com/photo-1544967082-d9d25d867d66?w=260&h=260&fit=crop&auto=format&q=75',
    fb:'#d4af37,#8B7000'
  },
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const S = {
  cards:[],cardEls:[],
  flipped:[],matched:new Set(),
  locked:false,pairs:0,attempts:0,
  gameTimeLeft:300,gameStarted:false,
  gameTimerId:null,turnTimerId:null,
  musicPlaying:false,audioCtx:null,
};

// ═══════════════════════════════════════════
// INDIE MUSIC  –  Am-F-C-G plucked guitar
// ═══════════════════════════════════════════
const BPM     = 108;
const BEAT    = 60 / BPM;          // seconds per beat

// Am  F   C   G  (each chord: [bass, ...strings])
const CHORDS = [
  { bass:110.00, notes:[220.00, 261.63, 329.63, 440.00] }, // Am
  { bass: 87.31, notes:[174.61, 220.00, 261.63, 349.23] }, // F
  { bass:130.81, notes:[261.63, 329.63, 392.00, 523.25] }, // C
  { bass:196.00, notes:[196.00, 246.94, 293.66, 392.00] }, // G
];

let chordIdx  = 0;
let musicLoop = null;

function initAudio(){
  if(S.audioCtx) return;
  S.audioCtx = new(window.AudioContext||window.webkitAudioContext)();
}

// Guitar pluck: sawtooth + lowpass filter with fast decay
function pluck(freq, t, vol=0.09, decay=0.65){
  if(!S.audioCtx||!S.musicPlaying) return;
  const ctx=S.audioCtx;
  const osc=ctx.createOscillator();
  const flt=ctx.createBiquadFilter();
  const g  =ctx.createGain();

  osc.type='sawtooth';
  osc.frequency.value=freq;

  flt.type='lowpass';
  flt.frequency.setValueAtTime(2800,t);
  flt.frequency.exponentialRampToValueAtTime(500,t+decay);
  flt.Q.value=0.8;

  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+decay);

  osc.connect(flt);flt.connect(g);g.connect(ctx.destination);
  osc.start(t);osc.stop(t+decay+0.05);
}

// Bass pluck: triangle wave, deeper
function bassPluck(freq,t,vol=0.17,decay=1.1){
  if(!S.audioCtx||!S.musicPlaying) return;
  const ctx=S.audioCtx;
  const osc=ctx.createOscillator();
  const flt=ctx.createBiquadFilter();
  const g  =ctx.createGain();

  osc.type='triangle';
  osc.frequency.value=freq;
  flt.type='lowpass';flt.frequency.value=380;flt.Q.value=1.5;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+decay);

  osc.connect(flt);flt.connect(g);g.connect(ctx.destination);
  osc.start(t);osc.stop(t+decay+0.05);
}

// Soft hi-hat: filtered noise
function hiHat(t,vol=0.014){
  if(!S.audioCtx||!S.musicPlaying) return;
  const ctx=S.audioCtx;
  const sz =Math.floor(ctx.sampleRate*0.04);
  const buf=ctx.createBuffer(1,sz,ctx.sampleRate);
  const d  =buf.getChannelData(0);
  for(let i=0;i<sz;i++) d[i]=Math.random()*2-1;

  const src=ctx.createBufferSource();
  const flt=ctx.createBiquadFilter();
  const g  =ctx.createGain();

  src.buffer=buf;
  flt.type='highpass';flt.frequency.value=9000;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);

  src.connect(flt);flt.connect(g);g.connect(ctx.destination);
  src.start(t);
}

// One 4-beat bar = one chord
function playBar(){
  if(!S.musicPlaying||!S.audioCtx) return;

  const ch  = CHORDS[chordIdx%4];
  const now = S.audioCtx.currentTime;
  const b   = BEAT;

  // Bass beats 1 & 3
  bassPluck(ch.bass,       now,       0.18, 1.1);
  bassPluck(ch.bass*1.498, now+b*2,   0.12, 0.9); // perfect 5th on beat 3

  // Down-strokes (arpeggio spread ≈ 30ms)
  const strum=(notes,t,vol,dec)=>notes.forEach((f,i)=>pluck(f,t+i*0.03,vol,dec));
  const upstrum=(notes,t,vol,dec)=>notes.slice().reverse().forEach((f,i)=>pluck(f,t+i*0.02,vol,dec));

  strum(ch.notes,  now,          0.075, 0.7);   // beat 1  ↓
  upstrum(ch.notes,now+b*0.5,   0.045, 0.55);   // beat 1.5 ↑
  strum(ch.notes,  now+b,        0.065, 0.65);   // beat 2  ↓
  upstrum(ch.notes,now+b*1.5,   0.040, 0.50);   // beat 2.5 ↑
  strum(ch.notes,  now+b*2,      0.070, 0.68);   // beat 3  ↓
  upstrum(ch.notes,now+b*2.5,   0.038, 0.48);   // beat 3.5 ↑
  strum(ch.notes,  now+b*3,      0.055, 0.60);   // beat 4  ↓
  upstrum(ch.notes,now+b*3.5,   0.035, 0.45);   // beat 4.5 ↑

  // Hi-hats on every 8th note
  for(let i=0;i<8;i++) hiHat(now+i*b*0.5, i%2===0?0.018:0.010);

  chordIdx++;
  musicLoop=setTimeout(playBar, b*4*1000-20); // -20ms drift correction
}

function startMusic(){
  initAudio();
  if(S.audioCtx.state==='suspended') S.audioCtx.resume();
  S.musicPlaying=true;
  chordIdx=0;
  playBar();
  const btn=document.getElementById('music-btn');
  btn.textContent='🎵 מוסיקה: פועל';
  btn.classList.add('on');
}

function stopMusic(){
  S.musicPlaying=false;
  if(musicLoop) clearTimeout(musicLoop);
  const btn=document.getElementById('music-btn');
  btn.textContent='🎵 מוסיקה: כבוי';
  btn.classList.remove('on');
}

function toggleMusic(){
  if(S.musicPlaying) stopMusic(); else startMusic();
}

// ── Sound effects ──
function sfxMatch(){
  initAudio();
  if(S.audioCtx.state==='suspended') S.audioCtx.resume();
  const now=S.audioCtx.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    const o=S.audioCtx.createOscillator(),g=S.audioCtx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.18,now+i*0.1);
    g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.1+0.35);
    o.connect(g);g.connect(S.audioCtx.destination);
    o.start(now+i*0.1);o.stop(now+i*0.1+0.4);
  });
}

function sfxMismatch(){
  initAudio();
  if(S.audioCtx.state==='suspended') S.audioCtx.resume();
  const now=S.audioCtx.currentTime;
  const o=S.audioCtx.createOscillator(),g=S.audioCtx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(220,now);
  o.frequency.exponentialRampToValueAtTime(80,now+0.25);
  g.gain.setValueAtTime(0.12,now);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.28);
  o.connect(g);g.connect(S.audioCtx.destination);
  o.start(now);o.stop(now+0.32);
}

// ═══════════════════════════════════════════
// BOARD
// ═══════════════════════════════════════════
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  return shuffle(CITIES.flatMap(c=>[
    {...c,uid:c.id+'-a'},
    {...c,uid:c.id+'-b'},
  ]));
}

function renderGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  S.cardEls=[];

  S.cards.forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='card';
    el.dataset.i=i;

    el.innerHTML=`
      <div class="card-inner">
        <div class="card-face card-back-face">
          <span class="q-mark">?</span>
        </div>
        <div class="card-face card-front-face"
             style="background:linear-gradient(135deg,${card.fb})">
          <img
            src="${card.img}"
            alt="${card.name}"
            loading="lazy"
            onerror="this.style.display='none'">
          <div class="name-bar">${card.name}</div>
        </div>
      </div>`;

    el.addEventListener('click',()=>onCardClick(i));
    grid.appendChild(el);
    S.cardEls.push(el);
  });
}

// Preview thumbnails on start screen
function buildPreview(){
  const wrap=document.getElementById('preview-imgs');
  CITIES.slice(0,9).forEach(c=>{
    const img=document.createElement('img');
    img.className='city-thumb';
    img.src=c.img;
    img.alt=c.name;
    img.onerror=()=>img.style.display='none';
    wrap.appendChild(img);
  });
}

// ═══════════════════════════════════════════
// GAME FLOW
// ═══════════════════════════════════════════
function startGame(){
  document.getElementById('ov-start').classList.add('hidden');
  Object.assign(S,{
    flipped:[],matched:new Set(),locked:false,pairs:0,attempts:0,
    gameTimeLeft:300,gameStarted:false,gameTimerId:null,turnTimerId:null,
  });
  S.cards=buildDeck();
  renderGrid();
  resetUI();
  startMusic();
}

function restartGame(){
  document.getElementById('ov-end').classList.add('hidden');
  clearInterval(S.gameTimerId);
  clearInterval(S.turnTimerId);
  stopMusic();
  startGame();
}

// ── Game timer ──
function startGameTimer(){
  S.gameTimerId=setInterval(()=>{
    S.gameTimeLeft--;
    updateTimeUI();
    if(S.gameTimeLeft<=0){ clearInterval(S.gameTimerId); endGame(false); }
  },1000);
}

function updateTimeUI(){
  const m=Math.floor(S.gameTimeLeft/60), sc=S.gameTimeLeft%60;
  const str=`${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
  document.getElementById('st-time').textContent=str;
  document.getElementById('lbl-time').textContent=str;
  const pct=(S.gameTimeLeft/300)*100;
  const fill=document.getElementById('fill-time');
  fill.style.width=pct+'%';
  const timeEl=document.getElementById('st-time');
  if(S.gameTimeLeft<=60){ fill.className='prog-fill total-fill danger'; timeEl.classList.add('urgent'); }
  else if(S.gameTimeLeft<=120){ fill.className='prog-fill total-fill warn'; timeEl.classList.remove('urgent'); }
  else{ fill.className='prog-fill total-fill'; timeEl.classList.remove('urgent'); }
}

// ── Turn timer ──
let turnSec=0;
function startTurnTimer(){
  turnSec=10;
  refreshTurnUI();
  S.turnTimerId=setInterval(()=>{
    turnSec--;
    refreshTurnUI();
    if(turnSec<=0){
      clearInterval(S.turnTimerId);
      const idx=S.flipped[0];
      if(idx!==undefined) S.cardEls[idx].classList.remove('flipped','selected');
      S.flipped=[];
      S.locked=false;
    }
  },1000);
}

function stopTurnTimer(){
  clearInterval(S.turnTimerId);
  S.turnTimerId=null;
  turnSec=0;
  refreshTurnUI();
}

function refreshTurnUI(){
  document.getElementById('fill-turn').style.width=(turnSec/10*100)+'%';
  const el=document.getElementById('st-turn');
  const lbl=document.getElementById('lbl-turn');
  if(turnSec>0){
    el.textContent=turnSec+'ש'; lbl.textContent=turnSec+'ש';
    el.classList.toggle('urgent',turnSec<=3);
  } else {
    el.textContent='—'; lbl.textContent='—';
    el.classList.remove('urgent');
  }
}

function resetUI(){
  document.getElementById('fill-time').style.width='100%';
  document.getElementById('fill-time').className='prog-fill total-fill';
  document.getElementById('fill-turn').style.width='0%';
  document.getElementById('st-time').textContent='05:00';
  document.getElementById('lbl-time').textContent='5:00';
  document.getElementById('st-turn').textContent='—';
  document.getElementById('lbl-turn').textContent='—';
  document.getElementById('st-time').classList.remove('urgent');
  document.getElementById('st-turn').classList.remove('urgent');
  updateStats();
}

function updateStats(){
  document.getElementById('st-pairs').textContent=`${S.pairs} / 18`;
  document.getElementById('st-attempts').textContent=S.attempts;
}

// ═══════════════════════════════════════════
// CLICK HANDLER
// ═══════════════════════════════════════════
function onCardClick(i){
  if(S.locked) return;
  if(S.matched.has(i)) return;
  if(S.flipped.includes(i)) return;
  if(S.flipped.length===2) return;

  initAudio();
  if(S.audioCtx.state==='suspended') S.audioCtx.resume();

  if(!S.gameStarted){ S.gameStarted=true; startGameTimer(); }

  S.cardEls[i].classList.add('flipped');
  S.flipped.push(i);

  if(S.flipped.length===1){
    S.cardEls[i].classList.add('selected');
    startTurnTimer();
    return;
  }

  // Second card
  stopTurnTimer();
  S.cardEls[S.flipped[0]].classList.remove('selected');
  S.attempts++;
  S.locked=true;

  const [a,b]=[S.flipped[0],S.flipped[1]];

  if(S.cards[a].id===S.cards[b].id){
    // ✅ Match
    setTimeout(()=>{
      S.matched.add(a); S.matched.add(b);
      S.cardEls[a].classList.add('matched');
      S.cardEls[b].classList.add('matched');
      S.pairs++;
      S.flipped=[];
      S.locked=false;
      sfxMatch();
      updateStats();
      if(S.pairs>=18) setTimeout(()=>endGame(true),700);
    },350);
  } else {
    // ❌ Mismatch
    setTimeout(()=>{
      S.cardEls[a].classList.add('mismatch');
      S.cardEls[b].classList.add('mismatch');
      sfxMismatch();
      setTimeout(()=>{
        S.cardEls[a].classList.remove('flipped','mismatch');
        S.cardEls[b].classList.remove('flipped','mismatch');
        S.flipped=[];
        S.locked=false;
      },680);
    },380);
  }
}

// ═══════════════════════════════════════════
// END GAME
// ═══════════════════════════════════════════
function endGame(won){
  clearInterval(S.gameTimerId);
  clearInterval(S.turnTimerId);
  stopMusic();
  S.locked=true;

  const timeUsed=300-S.gameTimeLeft;
  const m=Math.floor(timeUsed/60), sc=timeUsed%60;
  const acc=S.attempts>0?Math.round((S.pairs/S.attempts)*100):0;

  document.getElementById('end-title').textContent=won?'🎉 כל הכבוד!':'⏰ הזמן נגמר!';
  document.getElementById('end-sub').textContent  =won
    ?`מצאת את כל 18 הזוגות! אלוף! 🌍✨`
    :`מצאת ${S.pairs} מתוך 18 זוגות – נסה שוב!`;

  document.getElementById('end-scores').innerHTML=`
    <div class="sc-item"><div class="sc-label">זוגות שנמצאו</div><div class="sc-val">${S.pairs}/18</div></div>
    <div class="sc-item"><div class="sc-label">ניסיונות</div><div class="sc-val">${S.attempts}</div></div>
    <div class="sc-item"><div class="sc-label">דיוק</div><div class="sc-val">${acc}%</div></div>
    <div class="sc-item"><div class="sc-label">זמן</div><div class="sc-val">${m}:${String(sc).padStart(2,'0')}</div></div>
  `;

  document.getElementById('ov-end').classList.remove('hidden');
}

// ── Init preview on page load ──
buildPreview();
</script>
